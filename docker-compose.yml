services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulumi-homelab-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - pulumi_sqlite_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  pulumi_sqlite_data:
